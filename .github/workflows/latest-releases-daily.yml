name: Latest Releases Daily Scan

on:
  schedule:
    # 03:30 UTC daily = 09:00 AM IST (Asia/Kolkata, UTC+5:30)
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-releases-discovery-scan
  cancel-in-progress: false

jobs:
  discovery-scan:
    name: Run Discovery Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUD_MODE: "1"
      LATEST_RELEASES_ENABLED: "1"
      LATEST_RELEASES_MAX_PAGES: "20"
      REQUIRE_POSTGRES: "1"
      GITHUB_OWNER: vamshivamshi9630
      MUSICDATA_GITHUB_REPOSITORY: MusicData
      GITHUB_BRANCH: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq5 ca-certificates
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import psycopg2, bs4, PIL, fastapi; print('Dependencies verified successfully')"

      - name: Verify required secret configuration
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "$HAS_DATABASE_URL" != "true" ]; then
            echo "::error::Missing required repository secret DATABASE_URL. Configure Settings -> Secrets and variables -> Actions -> DATABASE_URL."
            exit 1
          fi
          python - << 'EOF'
          import os, sys
          from backend.services.latest_releases.db import describe_database_url

          diag = describe_database_url(os.environ.get("DATABASE_URL"))
          req_pg = os.environ.get("REQUIRE_POSTGRES", "")
          print(
              f"Secret pre-check: DATABASE_URL present={diag['present']}, length={diag['length']}, "
              f"scheme={diag['scheme']!r}, valid_postgres_scheme={diag['valid_postgres_scheme']}, "
              f"normalized_wrapping={diag['normalized_wrapping']}, REQUIRE_POSTGRES={req_pg!r}"
          )
          if req_pg not in ("1", "true", "TRUE"):
              print("::error::REQUIRE_POSTGRES must be enabled (1) for production scheduled scans.")
              sys.exit(1)
          if not diag["present"] or not diag["valid_postgres_scheme"]:
              print(
                  "::error::DATABASE_URL secret does not contain a valid postgresql:// or postgres:// URI "
                  f"(detected scheme={diag['scheme']!r}). Paste Render's External Database URL verbatim without "
                  "extra command text (no psql prefix) or placeholder strings."
              )
              sys.exit(1)
          EOF

      - name: Run Latest Releases Discovery Engine CLI
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCHEDULER_ACTOR: github_actions_cron
        run: |
          python -m backend.services.latest_releases.cli scan
